<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — DishVerse</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom DishVerse CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { background-color: #121824; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    </style>
</head>
<body>

<div class="auth-card p-4 p-sm-5">
    <div class="text-center mb-4">
        <a href="/" class="text-decoration-none">
            <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-utensils text-danger me-2"></i>DishVerse</h3>
        </a>
        <p class="text-muted small mb-0">Sign in to access your recipe collection</p>
    </div>

    <!-- Error / Success Alert Notifications -->
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}">Error</div>
    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}">Success</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" name="username" class="form-control" placeholder="name@example.com" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-accent btn-lg w-100 mb-3 fs-6 shadow-sm"><i class="fa-solid fa-right-to-bracket me-1"></i> Sign In</button>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
        <p class="small text-muted mb-1">Don't have an account? <a href="/register" class="fw-semibold text-danger">Register here</a></p>
        <p class="small text-muted mb-0"><a href="/" class="text-secondary">← Back to Home Page</a></p>
    </div>
</div>

</body>
</html>
