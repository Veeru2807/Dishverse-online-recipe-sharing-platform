<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — DishVerse</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom DishVerse CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { background-color: #121824; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    </style>
</head>
<body>

<div class="auth-card p-4 p-sm-5 my-4">
    <div class="text-center mb-4">
        <a href="/" class="text-decoration-none">
            <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-utensils text-danger me-2"></i>DishVerse</h3>
        </a>
        <p class="text-muted small mb-0">Create your free chef account</p>
    </div>

    <!-- Error Alert Notification -->
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}">Error</div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
                <input type="text" th:field="*{name}" class="form-control" placeholder="John Doe" required autofocus>
            </div>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                <input type="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters" required>
            </div>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-check-double"></i></span>
                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Re-enter password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-accent btn-lg w-100 mb-3 fs-6 shadow-sm"><i class="fa-solid fa-user-plus me-1"></i> Create Free Account</button>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
        <p class="small text-muted mb-1">Already registered? <a href="/login" class="fw-semibold text-danger">Log In here</a></p>
        <p class="small text-muted mb-0"><a href="/" class="text-secondary">← Back to Home Page</a></p>
    </div>
</div>

</body>
</html>
