<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile — DishVerse</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom DishVerse CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Unified Header Navbar -->
    <div th:replace="~{fragments/common :: navbar}"></div>

    <div class="container my-5 max-w-600">
        <!-- Global Alert Notifications -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${errorMessage}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card form-card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <div class="stat-icon-box bg-primary-subtle text-primary">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0">Account Profile</h3>
                    <p class="text-muted small mb-0">Manage your profile details and security settings</p>
                </div>
            </div>

            <form th:action="@{/profile}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Full Name" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Email Address (Read-only)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" th:field="*{email}" class="form-control bg-light" readonly>
                    </div>
                </div>

                <div class="border-top pt-3 mb-4">
                    <h6 class="fw-bold mb-3 text-secondary"><i class="fa-solid fa-key me-2"></i>Change Password (Optional)</h6>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" th:field="*{newPassword}" class="form-control" placeholder="Leave empty to keep current password">
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent btn-lg w-100 fs-6 shadow-sm"><i class="fa-solid fa-floppy-disk me-1"></i> Update Profile</button>
                    <a href="/dashboard" class="btn btn-outline-secondary btn-lg px-4 fs-6">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Unified Footer Fragment -->
    <div th:replace="~{fragments/common :: footer}"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
