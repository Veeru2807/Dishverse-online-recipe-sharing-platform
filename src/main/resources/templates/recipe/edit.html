<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Recipe — DishVerse</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom DishVerse CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Unified Header Navbar -->
    <div th:replace="~{fragments/common :: navbar}"></div>

    <div class="container my-5 max-w-700">
        <div class="card form-card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                <div class="stat-icon-box bg-warning-subtle text-warning">
                    <i class="fa-solid fa-pen"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-0">Edit Recipe</h3>
                    <p class="text-muted small mb-0">Update your recipe title, description, ingredients, instructions, or dish photo.</p>
                </div>
            </div>

            <form th:action="@{'/recipes/edit/' + ${recipe.id}}" th:object="${recipe}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Recipe Title <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{title}" class="form-control" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Description / Category Tag <span class="text-danger">*</span></label>
                    <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Ingredients (Comma Separated) <span class="text-danger">*</span></label>
                    <textarea th:field="*{ingredients}" class="form-control" rows="4" required></textarea>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('ingredients')}" th:errors="*{ingredients}">Ingredients error</div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Preparation Instructions (Step by Step) <span class="text-danger">*</span></label>
                    <textarea th:field="*{instructions}" class="form-control" rows="5" required></textarea>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('instructions')}" th:errors="*{instructions}">Instructions error</div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Update Photo Attachment</label>
                    <div class="upload-dropzone">
                        <i class="fa-solid fa-cloud-arrow-up text-danger fa-2x mb-2"></i>
                        <h6 class="fw-semibold mb-1">Upload New Image File</h6>
                        <input type="file" name="imageFile" class="form-control" accept="image/*">
                        <small class="text-muted d-block mt-1">Leave empty to keep existing image file.</small>
                    </div>
                </div>

                <div class="d-flex gap-2 pt-2">
                    <button type="submit" class="btn btn-accent btn-lg px-4 fs-6"><i class="fa-solid fa-floppy-disk me-2"></i>Save Changes</button>
                    <a href="/recipes/my-recipes" class="btn btn-outline-secondary btn-lg px-4 fs-6">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Unified Footer Fragment -->
    <div th:replace="~{fragments/common :: footer}"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
