<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management — Admin</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom DishVerse CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Unified Header Navbar -->
    <div th:replace="~{fragments/common :: navbar}"></div>

    <div class="container my-5">
        <!-- Global Alert Notifications -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold page-title mb-1"><i class="fa-solid fa-users text-primary me-2"></i>User Account Management</h2>
                <p class="text-muted mb-0">View registered platform users, manage authority roles, and delete accounts</p>
            </div>
            <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm px-3"><i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard</a>
        </div>

        <!-- Users Table Wrapper -->
        <div class="table-wrapper">
            <div class="table-responsive">
                <table class="table table-custom table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Authority Role</th>
                            <th>Registered Date</th>
                            <th class="text-end">Account Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="userItem : ${users}">
                            <td class="fw-semibold text-secondary" th:text="'#' + ${userItem.id}">#1</td>
                            <td class="fw-bold text-dark" th:text="${userItem.name}">User Name</td>
                            <td class="text-muted small" th:text="${userItem.email}">user@example.com</td>
                            <td>
                                <span class="badge px-3 py-1 rounded-pill fw-semibold" 
                                      th:classappend="${userItem.role.name() == 'ROLE_ADMIN' ? 'bg-danger text-white' : 'bg-secondary text-white'}" 
                                      th:text="${userItem.role}">ROLE_USER</span>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(userItem.createdAt, 'dd MMM yyyy')}">Date</td>
                            <td class="text-end">
                                <div class="btn-group gap-1">
                                    <form th:if="${userItem.role.name() != 'ROLE_ADMIN'}" th:action="@{'/admin/users/role/' + ${userItem.id}}" method="post" class="d-inline">
                                        <input type="hidden" name="role" value="ROLE_ADMIN">
                                        <button type="submit" class="btn btn-sm btn-outline-primary px-2" title="Grant Admin Role"><i class="fa-solid fa-user-shield me-1"></i> Make Admin</button>
                                    </form>
                                    <form th:if="${userItem.role.name() == 'ROLE_ADMIN'}" th:action="@{'/admin/users/role/' + ${userItem.id}}" method="post" class="d-inline">
                                        <input type="hidden" name="role" value="ROLE_USER">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary px-2" title="Demote to Normal User"><i class="fa-solid fa-user me-1"></i> Make User</button>
                                    </form>
                                    <form th:action="@{'/admin/users/delete/' + ${userItem.id}}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this user account?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Account"><i class="fa-solid fa-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Unified Footer Fragment -->
    <div th:replace="~{fragments/common :: footer}"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
