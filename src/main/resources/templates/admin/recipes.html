<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All System Recipes — Admin</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom DishVerse CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Unified Header Navbar -->
    <div th:replace="~{fragments/common :: navbar}"></div>

    <div class="container my-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold page-title mb-1"><i class="fa-solid fa-utensils text-danger me-2"></i>All Platform Recipes</h2>
                <p class="text-muted mb-0">Overview of all approved, pending, and rejected community submissions</p>
            </div>
            <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm px-3"><i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard</a>
        </div>

        <!-- Recipes Table Wrapper -->
        <div class="table-wrapper">
            <div class="table-responsive">
                <table class="table table-custom table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th style="width: 70px;">Image</th>
                            <th>Recipe Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Submitted Date</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rec : ${recipes}">
                            <td>
                                <div style="width: 48px; height: 48px;" class="rounded-3 overflow-hidden bg-light shadow-sm">
                                    <img th:if="${rec.imageUrl != null and (rec.imageUrl.startsWith('http://') or rec.imageUrl.startsWith('https://'))}" th:src="${rec.imageUrl}" class="w-100 h-100 object-fit-cover" alt="Thumbnail">
                                    <img th:if="${rec.imageUrl != null and !(rec.imageUrl.startsWith('http://') or rec.imageUrl.startsWith('https://'))}" th:src="@{'/uploads/recipes/' + ${rec.imageUrl}}" class="w-100 h-100 object-fit-cover" alt="Thumbnail">
                                    <img th:if="${rec.imageUrl == null or rec.imageUrl.isEmpty()}" src="https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=100&q=80" class="w-100 h-100 object-fit-cover" alt="Default Food">
                                </div>
                            </td>
                            <td>
                                <a th:href="@{'/recipes/details/' + ${rec.id}}" class="fw-bold text-dark text-decoration-none" th:text="${rec.title}" target="_blank">Title</a>
                            </td>
                            <td class="small fw-semibold text-secondary" th:text="${rec.user.name}">Author</td>
                            <td>
                                <span class="badge-category" th:text="${rec.description != null and rec.description.startsWith('[Category:') ? rec.description.substring(11, rec.description.indexOf(']')) : 'Recipe'}">Category</span>
                            </td>
                            <td>
                                <span class="badge px-3 py-1 rounded-pill" th:classappend="'badge-status-' + ${rec.status}" th:text="${rec.status}">PENDING</span>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(rec.createdAt, 'dd MMM yyyy')}">Date</td>
                            <td class="text-end">
                                <div class="btn-group gap-1">
                                    <form th:if="${rec.status.name() != 'APPROVED'}" th:action="@{'/admin/recipes/approve/' + ${rec.id}}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-success" title="Approve Recipe"><i class="fa-solid fa-check"></i></button>
                                    </form>
                                    <form th:if="${rec.status.name() != 'REJECTED'}" th:action="@{'/admin/recipes/reject/' + ${rec.id}}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Reject Recipe"><i class="fa-solid fa-xmark"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Unified Footer Fragment -->
    <div th:replace="~{fragments/common :: footer}"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
